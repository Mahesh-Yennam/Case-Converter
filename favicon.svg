<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="caseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="14" fill="#090e1a"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#caseGrad)" stroke-width="2" stroke-opacity="0.8"/>
  
  <!-- Stylized "Aa" Typography Icon with transformation arrow -->
  <g filter="url(#caseGlow)">
    <!-- Capital "A" -->
    <path d="M14 44 L25 18 L36 44 M18 36 L32 36" 
          fill="none" stroke="#f59e0b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Small "a" -->
    <path d="M48 28 C45 28 41 30 41 35 C41 40 45 44 49 44 C53 44 55 42 55 39 L55 28 M55 35 C52 35 44 35 44 40 C44 44 49 44 53 41 L55 44" 
          fill="none" stroke="#10b981" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Subtle transformation arc/arrow -->
    <path d="M28 14 C36 10 44 11 50 16 M48 12 L50 16 L45 18" 
          fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
